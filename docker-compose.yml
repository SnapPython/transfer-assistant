services:
  transfer-assistant:
    build: .
    container_name: transfer-assistant
    restart: unless-stopped
    environment:
      FTA_TOKEN: ${FTA_TOKEN:?set FTA_TOKEN in .env}
      FTA_MAX_UPLOAD_MB: ${FTA_MAX_UPLOAD_MB:-512}
      FTA_MAX_TEXT_CHARS: ${FTA_MAX_TEXT_CHARS:-200000}
      FTA_CORS_ORIGINS: ${FTA_CORS_ORIGINS:-}
      FTA_TOTP_SECRET: ${FTA_TOTP_SECRET:-}
      FTA_WEB_AUTH_MODE: ${FTA_WEB_AUTH_MODE:-token_totp}
      FTA_LOGIN_LOCK_FAILURES: ${FTA_LOGIN_LOCK_FAILURES:-3}
      FTA_LOGIN_LOCK_SECONDS: ${FTA_LOGIN_LOCK_SECONDS:-900}
      FTA_PROXY_AUTH_SECRET: ${FTA_PROXY_AUTH_SECRET:-}
    ports:
      - "${FTA_PORT:-8787}:8787"
    volumes:
      - ./data:/data
