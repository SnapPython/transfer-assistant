services:
  transfer-assistant:
    build: .
    container_name: transfer-assistant
    restart: unless-stopped
    environment:
      FTA_TOKEN: ${FTA_TOKEN:?set FTA_TOKEN in .env}
      FTA_MAX_UPLOAD_MB: ${FTA_MAX_UPLOAD_MB:-512}
      FTA_MAX_TEXT_CHARS: ${FTA_MAX_TEXT_CHARS:-200000}
      FTA_CORS_ORIGINS: ${FTA_CORS_ORIGINS:-}
      FTA_TOTP_SECRET: ${FTA_TOTP_SECRET:-}
      FTA_WEB_AUTH_MODE: ${FTA_WEB_AUTH_MODE:-token_totp}
      FTA_LOGIN_LOCK_FAILURES: ${FTA_LOGIN_LOCK_FAILURES:-3}
      FTA_LOGIN_LOCK_SECONDS: ${FTA_LOGIN_LOCK_SECONDS:-900}
      FTA_PROXY_AUTH_SECRET: ${FTA_PROXY_AUTH_SECRET:-}
    ports:
      # Loopback only. A reverse proxy (Caddy, or `tailscale serve`) is the
      # intended entry point; publishing on every interface exposes the
      # application's own login surface directly over plain HTTP, bypassing
      # both TLS and any proxy-level authentication in front of it.
      # Set FTA_BIND=0.0.0.0 only for a deliberately public host.
      - "${FTA_BIND:-127.0.0.1}:${FTA_PORT:-8787}:8787"
    volumes:
      - ./data:/data
